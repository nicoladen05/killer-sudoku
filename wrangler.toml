name = "cagey"
pages_build_output_dir = "public"
compatibility_date = "2026-10-01"

# Leaderboard (Pages Functions in ./functions). Schema: migrations/0001_scores.sql
[[d1_databases]]
binding = "DB"
database_name = "cagey-leaderboard"
database_id = "f9b9054c-04bc-496d-bb95-ab1c6544d7cc"

# Preview deployments (pull requests, branches) use their own database.
[[env.preview.d1_databases]]
binding = "DB"
database_name = "cagey-leaderboard-preview"
database_id = "da05c05c-58c8-456b-b17f-5d1aa1b06c28"
